<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Amegah — CV</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaed;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #151821;
    }

    .toolbar a,
    .toolbar button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: transparent;
      color: inherit;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .toolbar button.primary,
    .toolbar a.primary {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .toolbar a:hover,
    .toolbar button:hover {
      border-color: rgba(255, 255, 255, 0.24);
    }

    .cv-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 57px);
      border: 0;
      background: #fff;
    }

    @media print {
      body {
        background: #fff;
      }

      .toolbar {
        display: none;
      }

      .cv-frame {
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <a href="../index.html">&larr; Back to portfolio</a>
    <button type="button" class="primary" onclick="printCV()">Print CV</button>
    <a href="Bill_Amegah.pdf" download="Bill_Amegah_CV.pdf">Download PDF</a>
  </div>
  <iframe
    id="cv-frame"
    class="cv-frame"
    src="Bill_Amegah.pdf"
    title="Bill Amegah CV"
  ></iframe>
  <script>
    function printCV() {
      const frame = document.getElementById("cv-frame");
      if (!frame || !frame.contentWindow) return;
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }

    if (new URLSearchParams(window.location.search).get("print") === "1") {
      window.addEventListener("load", () => window.setTimeout(printCV, 700));
    }
  </script>
</body>
</html>
